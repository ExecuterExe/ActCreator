# Render Blueprint для АктКреватора — тестовый бесплатный вариант.
# Репозиторий = папка site. New → Blueprint → выбрать репозиторий.
# Ключ OpenRouter Render спросит при создании (sync: false) — в репозиторий его не кладём.
#
# Библиотеки едут из папки libraries/ (копия 08_Библиотеки; перед коммитом — sync_libraries.py).
# На бесплатном плане диск временный: пользователи и сессии стираются при перезапуске, деплое
# и после «сна» сервиса. Данные исследования уходят в Google Sheets (README, «Данные исследования»);
# аккаунты и вопросы через 2–7 дней сохраняет только план starter + диск.
services:
  - type: web
    name: actkreator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 процесс: на бесплатном плане мало памяти; timeout 120 — ответы ИИ идут до 15–40 секунд
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat
      - key: PILOT_FULL_ACCESS
        value: "1"
      - key: ACTKREATOR_SECRET
        generateValue: true
      - key: ACTKREATOR_HTTPS
        value: "1"
      # логины команды через запятую: им открыта страница /admin (хранилище, выгрузка, копия базы)
      - key: ACTKREATOR_ADMINS
        sync: false
      # данные исследования — в Google Sheets (диск бесплатного плана временный); настройка — README.
      # Способ А (проще): Apps Script в самой таблице
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_TOKEN
        sync: false
      # Способ Б: сервисный аккаунт Google Cloud (не задавать, если используется способ А)
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
