<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}АктКреватор{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}"><b>АктКреватор</b></a>
    <nav>
      {% if g.user %}
        <a href="{{ url_for('me') }}">{{ g.user['login'] }}</a>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button type="submit" class="link">Выйти</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Войти</a>
        <a href="{{ url_for('register') }}">Регистрация</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
